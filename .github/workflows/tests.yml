# Corre las dos suites en Actions, **solo a mano** (`gh workflow run tests.yml
# --ref <rama>` o el botón "Run workflow").
#
# Hasta noviembre de 2026 corría en cada push a `main` y en cada pull request. Se
# apagó por costo: cada corrida eran 10-15 minutos de runner macOS, que se cobra
# con multiplicador, y duplicaba exactamente lo que `bin/gates` ya corre en local
# antes de cada push, PR y merge (tipos, lint, Vitest, cargo test y cargo test en
# UTC). Los minutos se acabaron y además hubo días sin runners macOS disponibles,
# con PRs esperando una cola que no avanzaba. **El CI de sunrise es `bin/gates`**,
# y el hook `.claude/hooks/require-gates.sh` lo exige sobre el árbol commiteado.
# El porqué completo y lo que se pierde, en docs/DECISIONES.md §12.
#
# Queda para cuando haga falta un entorno limpio de verdad: sospecha de que algo
# pasa solo en la máquina del dev, un cambio de toolchain o de dependencias.
#
# Es un workflow aparte de `release.yml` a propósito: ese publica —tiene permiso
# de escritura sobre el repo y toca la llave del updater— y se dispara solo con un
# tag. Éste no publica nada.
name: tests

on:
  workflow_dispatch:

# Solo leer. `release.yml` necesita `contents: write` para crear el Release; acá
# escribir no hace falta.
permissions:
  contents: read

# Dos disparos sobre la misma rama: el segundo cancela al primero.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    # macOS y no `ubuntu-latest`, y la razón **no** es la del runner de
    # `release.yml` (allá manda el SDK, que decide la apariencia de la ventana).
    # Acá es más simple: `pnpm test:rust` compila el crate de Tauri entero, y en
    # Linux eso arrastra las dependencias de sistema de webkit2gtk. Además es la
    # plataforma en la que la app corre; probar en otra sería probar otra cosa.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      # Sin `version:`, igual que en release.yml: `action-setup` lee
      # `packageManager` de package.json y así CI no puede divergir de local.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # `cache: pnpm` explícito y no de más: desde `setup-node` v6 el caché
          # automático es **solo para npm**, y con otro gestor hay que pedirlo. Sin
          # esta línea, `pnpm install` se baja todo de nuevo en cada corrida.
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Antes de las suites, porque Vitest transpila con esbuild y **no
      # typechequea**: un error de tipos pasaba las dos suites en verde y recién
      # aparecía dentro del build de `release.yml`, o sea con el tag ya empujado y
      # la versión ya commiteada. Es el mismo modo de falla que este workflow vino
      # a cerrar para los tests, y estaba abierto para los tipos.
      - run: pnpm typecheck

      # Biome hace lint y formato en un solo binario de Rust, así que este paso
      # cuesta menos de un segundo. Lo que vigila de verdad es
      # `useExhaustiveDependencies`: un `useEffect` al que le falta una dependencia
      # es la clase de bug por la que existe la skill `sunrise-sync-ventanas`, y
      # hasta ahora no tenía ningún respaldo automático.
      - run: pnpm lint

      - run: pnpm test:all
