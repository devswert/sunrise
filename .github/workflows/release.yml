# Publica el .dmg de sunrise en un GitHub Release.
#
# Se dispara **solo** al empujar un tag `v*` (v0.1.0, v1.2.3). No hay
# `workflow_dispatch` a propósito: disparado a mano desde una rama, el `tagName`
# de abajo valdría `main`, y publicaría un Release llamado "sunrise main" con un
# tag `main` — basura difícil de limpiar en un repo público.
#
# Para sacar una versión, usa la skill `sunrise-release`: sube la versión en los
# tres archivos, escribe la entrada del changelog, commitea y empuja el tag. A
# mano son cuatro pasos y el que se olvida siempre es el changelog.
#
# El paso "versión" de acá falla si el tag no coincide con esos archivos, que es
# el único lugar donde eso se puede pillar: los tests de Rust comprueban que los
# tres archivos coincidan **entre sí**, pero no saben nada del tag.
name: release

on:
  push:
    tags: ["v*"]

# El Release lo crea el propio workflow.
permissions:
  contents: write

jobs:
  dmg:
    # Fijo y no `macos-latest`, por dos razones distintas:
    #
    # 1. **Arquitectura.** Este proyecto compila solo arm64, y `macos-13` es Intel:
    #    ahí saldría un .dmg que no corre en el Mac de nadie del equipo.
    # 2. **El SDK con el que se enlaza decide la apariencia de la ventana.** macOS
    #    le da a cada app el marco de su SDK, así que un runner viejo publica
    #    binarios con los botones de ventana de una versión anterior mientras en
    #    desarrollo se ven los actuales. Pasó con `macos-14` (SDK 14.5): la app
    #    distribuida no se veía como la compilada en la máquina del dev.
    #
    # `macos-latest` resolvería lo segundo, pero moviéndose solo: la apariencia de
    # lo que publicas cambiaría un día sin que nadie tocara nada. Se sube a mano.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: versión
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          conf_v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg_v=$(node -p "require('./package.json').version")
          echo "tag=$tag cargo=$cargo_v conf=$conf_v package=$pkg_v"
          for v in "$cargo_v" "$conf_v" "$pkg_v"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::el tag $GITHUB_REF_NAME no coincide con la versión $v del repo"
              exit 1
            fi
          done

      # Sin `version:` a propósito: `action-setup` lee `packageManager` de
      # package.json, así que la versión de CI no puede separarse de la local. Con
      # el número acá escrito a mano, un `pnpm install --frozen-lockfile` contra un
      # lockfile de otra major falla, y eso solo se ve en la primera corrida.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # El build de release desde cero toma unos tres minutos en local; sin caché
      # en CI son más, y se pagan en cada tag.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # El cuerpo del Release sale de `docs/CHANGELOG.md`, no de un texto fijo:
      # es el mismo párrafo que la app muestra en el modal "Lo nuevo" y en Configs
      # → Actualizaciones, porque prometer una cosa y anunciar otra no lo pilla
      # nadie hasta que ya está publicado.
      #
      # Se extrae del archivo y no del mensaje del tag: el checkout trae el
      # archivo siempre, y con un tag ligero (o un `fetch-depth` corto) la
      # anotación puede no estar. Es el único paso que no se puede ensayar antes
      # del primer tag, así que no depende de nada que pueda faltar.
      - name: notas del release
        id: notas
        run: |
          # Cada paso corre en su propio shell: `tag` del paso anterior no llega
          # hasta acá, así que se vuelve a sacar del ref.
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            $0 ~ "^## v" v "([^0-9.]|$)" { dentro=1; next }
            dentro && /^## v/ { exit }
            dentro { print }
          ' docs/CHANGELOG.md > /tmp/notas.md
          if [ ! -s /tmp/notas.md ]; then
            echo "::error::docs/CHANGELOG.md no tiene una sección '## v$tag'"
            exit 1
          fi
          {
            echo "body<<SUNRISE_EOF"
            cat /tmp/notas.md
            echo ""
            echo "---"
            echo ""
            echo "**Si es tu primera instalación**: abre el \`.dmg\`, arrastra sunrise a"
            echo "Aplicaciones y quítale la cuarentena que le puso el navegador:"
            echo ""
            echo "\`\`\`bash"
            echo "xattr -cr /Applications/sunrise.app"
            echo "\`\`\`"
            echo ""
            echo "Ese paso no es opcional. El paquete está firmado ad-hoc y no con una"
            echo "cuenta de Apple Developer, y macOS lo reporta como **dañado** hasta que"
            echo "le quites la marca. Una sola vez."
            echo ""
            echo "Después, la app se actualiza sola desde Configs → General →"
            echo "Actualizaciones. Esas descargas no vuelven a pasar por el aviso."
            echo "SUNRISE_EOF"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      # Las dos suites antes de empaquetar. Un .dmg publicado con tests rojos es
      # peor que no publicar: alguien lo instala.
      - run: pnpm test:all

      # Las dos llaves del updater. Sin ellas `tauri-action` **no falla**: publica
      # artefactos sin firmar, y la app los rechaza al intentar actualizar — un
      # Release que se ve bien y no sirve. La privada vive en los secrets del repo
      # (Settings → Secrets and variables → Actions); la pública está en
      # `tauri.conf.json` y sí va versionada.
      #
      # La llave se generó sin contraseña a propósito: guardarla al lado de la
      # llave, en el mismo almacén de secrets, no protege de nada. La variable va
      # igual porque el firmador la exige aunque esté vacía.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: sunrise ${{ github.ref_name }}
          releaseBody: ${{ steps.notas.outputs.body }}
          releaseDraft: false
          prerelease: false
