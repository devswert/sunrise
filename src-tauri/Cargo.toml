[package]
name = "sunrise"
version = "0.1.0"
description = "sunrise — planner diario de escritorio, con los datos en tu máquina"
authors = ["Leonardo"]
edition = "2021"

[lib]
name = "sunrise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
rodio = "0.19"  # con decodificadores por defecto (wav/mp3/flac/vorbis)
thiserror = "2"
icalendar = { version = "0.17.13", features = ["chrono-tz", "recurrence"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "system-proxy", "gzip"] }
chrono-tz = "0.10.4"
tokio = { version = "1.53.1", features = ["time"] }
tauri-plugin-opener = "2.5.4"
# Solo `deflate`: los defaults arrastran zstd, lzma, bzip2 y AES, que son
# formatos que nunca vamos a escribir ni a leer (el .zip lo hace esta app).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.7.2"
tempfile = "3.27.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2"

[features]
# default Tauri custom-protocol for production bundling
custom-protocol = ["tauri/custom-protocol"]
