[package]
name = "sunrise"
version = "0.11.0"
description = "sunrise — planner diario de escritorio, con los datos en tu máquina"
authors = ["Leonardo"]
edition = "2021"

[lib]
name = "sunrise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: al registrar el MCP se reescribe la configuración de Claude
# Desktop, que la gente edita a mano; sin esto saldría con las claves en orden
# alfabético (§4.32).
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
rodio = "0.19"  # con decodificadores por defecto (wav/mp3/flac/vorbis)
thiserror = "2"
icalendar = { version = "0.17.13", features = ["chrono-tz", "recurrence"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "system-proxy", "gzip"] }
chrono-tz = "0.10.4"
# El nombre IANA de la zona del sistema (`America/Santiago`), que `chrono::Local` no
# expone. Ya venía en el árbol como dependencia de chrono; se declara para poder
# usarlo desde `repo::zone` cuando el ajuste de zona está vacío.
iana-time-zone = "0.1"
# `macros` es por el `select!` del vigilante de la campana (`bell.rs`), que espera
# el momento de sonar o el timbre de "arrancó un timer", lo que llegue primero.
tokio = { version = "1.53.1", features = ["time", "macros", "sync", "rt"] }
tauri-plugin-opener = "2.5.4"
# Solo `deflate`: los defaults arrastran zstd, lzma, bzip2 y AES, que son
# formatos que nunca vamos a escribir ni a leer (el .zip lo hace esta app).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.7.2"
tempfile = "3.27.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2"
# El servidor MCP que lanza Claude Desktop con `sunrise --mcp` (§4.32). Versión
# exacta: el SDK todavía mueve su API entre menores, y las macros generan código
# que depende de ella.
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "macros"] }
# El esquema JSON de los parámetros de cada tool, que `rmcp` arma con esto.
schemars = "1.2.3"

# El aviso con botón que queda pegado en pantalla (§4.25). El plugin de
# notificaciones no sirve para esto: manda por `notify-rust`, cuyo backend de
# macOS solo pasa título, cuerpo, icono y sonido — nunca un botón de acción, que
# es justamente lo que hace que macOS muestre una **alerta** en vez de un banner.
[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22.0.0"
mac-notification-sys = "0.6"

[features]
# default Tauri custom-protocol for production bundling
custom-protocol = ["tauri/custom-protocol"]
